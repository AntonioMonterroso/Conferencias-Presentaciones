<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentador · Contabilidad de un Partido Político</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/monograma-m.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
</head>
<body class="presenter" data-role="presenter">
<div class="pv">
  <header>
    <img src="assets/logo-monterroso-blanco.png" alt="Firma de Auditoría Monterroso">
    <span class="ttl">Vista del presentador</span>
    <span class="status" id="status">Visualizador sin conectar</span>
    <span class="sp"></span>
    <div class="clock">
      <div class="box" id="tPace"><b id="tPaceV">—</b><span>Ritmo</span></div>
      <div class="box"><b id="tElapsed">0:00</b><span>Transcurrido</span></div>
      <div class="box"><b id="tLeft">90:00</b><span>Restante</span></div>
      <div class="box"><b id="tClock">--:--</b><span>Hora</span></div>
    </div>
  </header>
  <section class="left">
    <div id="curHolder"></div>
    <div class="steps" id="steps"></div>
    <div class="secbar" id="secbar"></div>
  </section>
  <section class="right">
    <div><div class="lab" id="nextLab">Siguiente<span></span><span id="nextTtl" style="color:var(--mute);font-weight:400;letter-spacing:0;text-transform:none"></span></div><div id="nextHolder"></div></div>
    <div class="notes" id="notes">
      <div class="lab" style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between"><span>Notas del presentador</span><span><button class="btn" id="nMinus" type="button" style="padding:2px 12px;font-size:14px" aria-label="Reducir letra">A−</button> <button class="btn" id="nPlus" type="button" style="padding:2px 12px;font-size:14px" aria-label="Aumentar letra">A+</button></span></div>
      <h3 class="n-t" id="nTitle"></h3>
      <div class="n-b" id="nBody"></div>
      <div class="n-m" id="nMeta"></div>
    </div>
  </section>
  <footer>
    <button class="btn" id="btnPrev" type="button">← Anterior</button>
    <button class="btn gold big" id="btnNext" type="button">Siguiente →</button>
    <span class="cnt2" id="cnt"></span>
    <span class="sp"></span>
    <button class="btn" id="btnBlack" type="button" title="Pantalla en negro (B)">Negro</button>
    <button class="btn" id="btnGrid" type="button" title="Vista general (G)">Vista general</button>
    <button class="btn" id="btnTimer" type="button" title="T">Iniciar reloj</button>
    <button class="btn" id="btnReset" type="button">Reiniciar reloj</button>
    <button class="btn gold" id="btnOpen" type="button">Abrir visualizador</button>
  </footer>
</div>
<div id="grid"><div class="gh"><span>Vista general · clic para saltar</span><button class="btn" id="gridClose" type="button">Cerrar (Esc)</button></div><div class="gg"></div></div>
<script src="js/slides-1.js"></script>
<script src="js/slides-1b.js"></script>
<script src="js/slides-2.js"></script>
<script src="js/slides-3.js"></script>
<script src="js/slides-4.js"></script>
<script src="config.js"></script>
<script src="js/data-source.js"></script>
<script src="js/boot.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
